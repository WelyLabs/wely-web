error_log  /var/log/nginx/error.log debug;

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Debugging
    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the hashed bundles of one build. Without a Cache-Control the browser may
    # keep it heuristically (it has a Last-Modified), and after a deploy go on asking for bundles
    # the new image no longer has, which answer 404. no-cache revalidates it on every load; the
    # SPA fallback above lands here too, as an internal redirect to /index.html.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Not in every nginx's mime.types: served as text/plain, some browsers ignore the manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # The push service worker: never cached, or a fix would wait for the browser's own update
    # check. An exact match, so the long cache of the *.js rule below does not apply.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # Adding resolver for Kubernetes Internal DNS (kube-dns)
    resolver ${DNS_RESOLVER} valid=30s ipv6=off;

    # The date poll's live stream (SSE): unbuffered and long-lived, or votes would arrive late
    # and the connection would drop after the default 60 s read timeout.
    location ~ ^/api/v1/events-service/events/[^/]+/poll/stream$ {
        set $target ${GATEWAY_URL};
        proxy_pass $target;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The notification center's live stream (SSE): same treatment as the poll stream.
    location = /api/v1/notifications-service/notifications/stream {
        set $target ${GATEWAY_URL};
        proxy_pass $target;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to the internal gateway (explicitly using /api/v1)
    location /api/v1/ {
        # Profile pictures are uploaded through here: wely-users accepts up to 5 MB, nginx's
        # default would refuse anything above 1 MB before it reached the gateway.
        client_max_body_size 6m;
        set $target ${GATEWAY_URL};
        proxy_pass $target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add some debug headers
        add_header X-Debug-Path $request_uri;
    }

    # Proxy RSocket (Websocket) requests
    location /rsocket {
        set $target ${GATEWAY_URL};
        proxy_pass $target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Cache static assets
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Cache css and js
    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
