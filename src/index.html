<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Wely · vos agendas, partagés avec ceux qui comptent</title>
  <base href="/">
  <!-- No zoom: an app screen, not a document. A pinch or a double tap left the layout half off
       screen; text that needs it is sized to be read as is (16px fields keep iOS from zooming
       on focus). iOS ignores user-scalable, hence the gesture guard in main.ts. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Créez un événement : vos amis le voient passer dans leur fil et le rejoignent en un clic. Projet open source, démo en libre accès.">
  <meta name="theme-color" content="#fcfaf7">

  <!-- Link previews (LinkedIn, Slack, messaging apps). Crawlers do not run JavaScript, so these
       must be in the static page. ${PUBLIC_URL} is the site's own origin, written in by
       entrypoint.sh at container start like KEYCLOAK_URL: the image URL has to be absolute,
       and the origin differs between environments. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Wely">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="Wely · vos agendas, partagés avec ceux qui comptent">
  <meta property="og:description" content="Créez un événement : vos amis le voient passer dans leur fil et le rejoignent en un clic. Projet open source, démo en libre accès.">
  <meta property="og:url" content="${PUBLIC_URL}/">
  <meta property="og:image" content="${PUBLIC_URL}/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Page d'accueil de Wely, avec une réplique de l'application montrant une semaine d'événements, une conversation et une carte d'événement.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" sizes="16x16 32x32 48x48">
  <!-- Installable: added to the home screen, Wely opens without the browser's bars. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Wely">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    window.KEYCLOAK_URL = '${KEYCLOAK_URL}';
    // One Keycloak serves every environment, one realm each, so the realm and the client are
    // injected like the URL rather than built into the bundle.
    window.KEYCLOAK_REALM = '${KEYCLOAK_REALM}';
    window.KEYCLOAK_CLIENT_ID = '${KEYCLOAK_CLIENT_ID}';
  </script>
  <!-- The theme last chosen on this browser, set before the first paint: applied by Angular
       only, a dark theme flashed white on every load. ThemeService takes over once started;
       the key and the values are its THEME_STORAGE_KEY and ThemePreference. -->
  <script>
    (function () {
      var theme = 'SYSTEM';
      try { theme = localStorage.getItem('wely.theme') || theme; } catch (e) { /* storage refused */ }
      var dark = theme === 'DARK'
        || (theme !== 'LIGHT' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
