<div class="popover-container" [style.left.px]="isMobile() ? 0 : position().x" [style.top.px]="isMobile() ? 0 : position().y"
    [class.arrow-left]="!isMobile() && position().arrowSide === 'left'"
    [class.arrow-right]="!isMobile() && position().arrowSide === 'right'"
    [class.arrow-top]="!isMobile() && position().arrowSide === 'top'" [class.mobile-centered]="isMobile()">
    <div class="popover-content">
        <div class="form-group title-group">
            <label class="visually-hidden" for="quick-event-title">Titre de l'événement</label>
            <input id="quick-event-title" type="text" [ngModel]="draft().title" (ngModelChange)="update('title', $event)"
                placeholder="Titre de l'événement" (keyup.enter)="onSave()">
        </div>

        <div class="form-group">
            <mat-icon>location_on</mat-icon>
            <label class="visually-hidden" for="quick-event-location">Lieu de l'événement</label>
            <input id="quick-event-location" type="text" [ngModel]="draft().location"
                (ngModelChange)="update('location', $event)" placeholder="Ajouter un lieu">
        </div>

        <div class="form-group date-group">
            <mat-icon>schedule</mat-icon>
            <div class="time-range">
                <span>{{ draft().startDate | date:'EEEE, d MMMM' }}</span>
                <span class="hours">{{ draft().startDate | date:'HH:mm' }} - {{ draft().endDate | date:'HH:mm' }}</span>
            </div>
        </div>

        <div class="form-group notes-group">
            <mat-icon>notes</mat-icon>
            <label class="visually-hidden" for="quick-event-notes">Notes de l'événement</label>
            <textarea id="quick-event-notes" [ngModel]="draft().description"
                (ngModelChange)="update('description', $event)" placeholder="Ajouter des notes"></textarea>
        </div>

        <div class="form-group checkbox-group">
            <label class="checkbox-container">
                <input type="checkbox" [ngModel]="draft().subscribeByDefault" (ngModelChange)="update('subscribeByDefault', $event)">
                <span>S'inscrire par défaut</span>
            </label>
        </div>

        <div class="form-actions">
            <button class="cancel-btn" (click)="onCancel()">Annuler</button>
            <button class="submit-btn" [disabled]="!draft().title" (click)="onSave()">Ajouter</button>
        </div>
    </div>
    <div class="popover-arrow" [style.top.%]="arrowOffset()"></div>
</div>
