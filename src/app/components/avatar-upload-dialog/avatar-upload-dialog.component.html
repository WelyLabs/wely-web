<div class="dialog-container">
  <div class="dialog-header">
    <h2>Photo de profil</h2>
    <button class="close-button" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="content">
    @if (!imageChangedEvent()) {
      <div class="upload-area">
        <div class="upload-placeholder" role="button" tabindex="0" (click)="fileInput.click()"
             (keydown.enter)="fileInput.click()" (keydown.space)="fileInput.click()">
          <mat-icon>add_a_photo</mat-icon>
          <span>Choisir une image</span>
        </div>
      </div>
    }

    @if (imageChangedEvent()) {
      <div class="cropper-area">
        <image-cropper [imageChangedEvent]="imageChangedEvent()" [maintainAspectRatio]="true" [aspectRatio]="1 / 1"
          format="png" (imageCropped)="imageCropped($event)" (imageLoaded)="imageLoaded($event)"
          (cropperReady)="cropperReady()" (loadImageFailed)="loadImageFailed()" [transform]="{ scale: scale() }"
        class="cropper"></image-cropper>
      </div>
    }

    <label class="visually-hidden" for="avatar-file-input">Choisir une image</label>
    <input id="avatar-file-input" type="file" (change)="fileChangeEvent($event)" #fileInput style="display: none"
      accept="image/*" />

    @if (imageChangedEvent()) {
      <div class="controls">
        <mat-icon>remove</mat-icon>
        <mat-slider min="0.5" max="3" step="0.1" [discrete]="false">
          <label class="visually-hidden" for="avatar-zoom">Zoom</label>
          <input id="avatar-zoom" matSliderThumb [ngModel]="scale()" (ngModelChange)="scale.set($event)">
        </mat-slider>
        <mat-icon>add</mat-icon>
      </div>
    }
  </div>

  <div class="actions">
    <button mat-button (click)="close()">Annuler</button>
    <button mat-flat-button color="primary" (click)="save()" [disabled]="!imageChangedEvent() || isLoading()">
      {{ isLoading() ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
  </div>
</div>
