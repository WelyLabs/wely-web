<div class="dialog-container">
    <div class="dialog-header">
        <h2 mat-dialog-title>{{ data.title }}</h2>
        <button mat-icon-button (click)="onCancel()" class="close-button" aria-label="Fermer">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <mat-dialog-content>
        <p class="message">{{ data.message }}</p>
        @if (data.details?.length) {
            <ul class="details">
                @for (detail of data.details; track detail) {
                    <li>{{ detail }}</li>
                }
            </ul>
        }
        @if (data.confirmationPhrase) {
            <div class="phrase-field">
                <label for="confirmation-phrase">{{ data.confirmationLabel || 'Pour confirmer, tape ' + data.confirmationPhrase }}</label>
                <input id="confirmation-phrase" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                    [value]="typed()" (input)="onTyped($any($event.target).value)" (keyup.enter)="onConfirm()">
            </div>
        }
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-stroked-button (click)="onCancel()" class="cancel-btn">
            {{ data.cancelText || 'Annuler' }}
        </button>
        <button mat-flat-button [color]="data.isDestructive ? 'warn' : 'primary'" (click)="onConfirm()"
            [class.destructive-btn]="data.isDestructive" class="confirm-btn" [disabled]="!canConfirm()">
            {{ data.confirmText || 'Confirmer' }}
        </button>
    </mat-dialog-actions>
</div>
